<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星探 (Star Scout) · 智能研判系统</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', sans-serif;
    color: #cfe4ff; -webkit-font-smoothing: antialiased;
  }

  :root {
    --cyan: #4fe3ff;
    --cyan-soft: rgba(79, 227, 255, .22);
    --amber: #ffb454;
    --line: rgba(79, 227, 255, .20);
    --bg-panel: rgba(9, 24, 46, .85);
  }

  /* ---------- 背景与全屏星空 ---------- */
  #bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
    opacity: 0.4; animation: pulseBg 24s ease-in-out infinite alternate;
  }
  @keyframes pulseBg { 0% { transform: scale(1); } 100% { transform: scale(1.06); } }
  
  #starfield { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,10,25,0) 0%, rgba(0,6,18,.6) 58%, rgba(0,3,10,.95) 100%);
  }

  /* ---------- 左侧悬浮导航栏 ---------- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 220px; z-index: 10;
    background: rgba(4, 12, 26, 0.45);
    border-right: 1px solid rgba(79,227,255,.15);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    display: flex; flex-direction: column;
  }
  .brand {
    padding: 24px 20px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(79,227,255,.1);
  }
  .brand-logo {
    width: 32px; height: 32px; display: grid; place-items: center;
    font-size: 16px; color: var(--cyan); border: 1px solid var(--cyan);
    border-radius: 50%; box-shadow: 0 0 12px rgba(79,227,255,.3);
  }
  .brand h1 { font-size: 16px; letter-spacing: .15em; color: #fff; }
  .brand p { font-size: 10px; color: rgba(140,200,235,.5); margin-top: 2px; }

  .nav-menu { padding: 20px 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .nav-item {
    padding: 12px 16px; border-radius: 4px; cursor: pointer;
    font-size: 13px; letter-spacing: .1em; color: rgba(190,225,250,.7);
    display: flex; align-items: center; gap: 10px; transition: all 0.2s;
  }
  .nav-item:hover { background: rgba(79,227,255,.1); color: #fff; }
  .nav-item.active {
    background: rgba(79,227,255,.15); color: var(--cyan);
    border-left: 3px solid var(--cyan);
  }
  .btn-scan-side {
    margin: 20px; padding: 12px; text-align: center;
    background: rgba(79,227,255,.15); border: 1px solid var(--cyan);
    color: #fff; border-radius: 4px; cursor: pointer; transition: all 0.2s;
    font-size: 13px; font-weight: bold;
  }
  .btn-scan-side:hover { background: rgba(79,227,255,.3); box-shadow: 0 0 15px rgba(79,227,255,.4); }
  .btn-scan-side:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- 顶部状态栏 ---------- */
  .topbar {
    position: fixed; top: 0; left: 220px; right: 0; height: 60px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; border-bottom: 1px solid rgba(79,227,255,.15);
    background: rgba(6,20,40,.3); backdrop-filter: blur(8px);
  }
  .top-info { display: flex; align-items: center; gap: 24px; }
  .clock { font-family: monospace; font-size: 16px; color: var(--cyan); letter-spacing: .1em; }
  .ip-loc { font-size: 12px; color: rgba(150,210,240,.8); letter-spacing: .05em; display: flex; align-items: center; gap: 6px;}
  
  .account-switch {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 6px 12px; border: 1px solid rgba(79,227,255,.3); border-radius: 4px;
    background: rgba(79,227,255,.05); transition: background 0.2s; font-size: 12px; color: #fff;
  }
  .account-switch:hover { background: rgba(79,227,255,.15); }

  /* 账号下拉 */
  .dropdown {
    position: absolute; top: 60px; right: 24px; width: 240px;
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 6px; display: none; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 100; backdrop-filter: blur(10px);
  }
  .dropdown.show { display: flex; }
  .acc-item { padding: 12px 16px; font-size: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .acc-item:hover { background: rgba(79,227,255,.1); }

  /* ---------- 弹窗 ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.75);
    backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-content {
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.8);
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 16px; color: #fff; letter-spacing: .1em;
  }
  .modal-close { cursor: pointer; color: #ff8080; font-size: 20px; line-height: 1; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; font-size: 14px; line-height: 1.6; }

  /* 表单与记录列表 */
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 12px; color: rgba(200,230,255,0.7); margin-bottom: 6px; }
  .form-group input {
    width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--line);
    border-radius: 4px; color: #fff; outline: none;
  }
  .record-item {
    display: flex; gap: 15px; padding: 15px; border: 1px solid rgba(79,227,255,.1);
    border-radius: 6px; margin-bottom: 10px; background: rgba(0,0,0,.2);
  }
  .record-item img { width: 120px; height: 80px; object-fit: cover; border-radius: 4px; cursor: pointer; }
  .record-info { flex: 1; }
  .record-title { color: var(--cyan); font-weight: bold; margin-bottom: 4px; }
  .record-time { font-size: 11px; color: rgba(255,255,255,.4); }

  .report-text {
    color: var(--cyan); font-size: 15px; border-left: 3px solid var(--cyan);
    padding-left: 12px; margin: 10px 0; background: rgba(79,227,255,.05); padding: 12px;
  }

  /* 悬停提示框 */
  #tooltip {
    position: fixed; pointer-events: none; z-index: 500;
    background: rgba(4,12,26,.9); border: 1px solid var(--cyan);
    padding: 8px 12px; border-radius: 4px; font-size: 12px; color: #fff;
    display: none; transform: translate(15px, 15px); box-shadow: 0 0 15px rgba(79,227,255,.3);
  }
</style>
</head>
<body>

<div id="bg-layer"></div>
<canvas id="starfield"></canvas>
<div id="vignette"></div>
<div id="tooltip"></div>

<!-- 左侧菜单栏 -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-logo">✦</div>
    <div>
      <h1>星探</h1>
      <p>STAR SCOUT v4.0</p>
    </div>
  </div>
  <div class="nav-menu">
    <div class="nav-item active" id="navDashboard">🛰️ 星图总控</div>
    <div class="nav-item" onclick="openModal('modalRecords')">🗂️ 记录档案</div>
    <div class="nav-item" onclick="openModal('modalSettings')">⚙️ 系统设置</div>
  </div>
  <button class="btn-scan-side" id="btnRandomScan">启动深空扫描</button>
</aside>

<!-- 顶部状态栏 -->
<header class="topbar">
  <div class="top-info">
    <div class="clock" id="clock">00:00:00</div>
    <div class="ip-loc" id="ipLocation">
      <span>📍</span> 正在获取实时坐标...
    </div>
  </div>
  
  <div class="account-switch" id="accSwitch">
    <span id="currentAccName">未绑定账号</span>
    <span>▼</span>
  </div>
  <div class="dropdown" id="accDropdown"></div>
</header>

<!-- 弹窗：系统设置 -->
<div class="modal-overlay" id="modalSettings">
  <div class="modal-content">
    <div class="modal-header"><span>系统设置 / 绑定账号</span><span class="modal-close" onclick="closeModal('modalSettings')">×</span></div>
    <div class="modal-body">
      <div style="margin-bottom:20px;">
        <h4 style="color:var(--cyan);margin-bottom:10px;">当前已保存账号</h4>
        <div id="accListContainer"></div>
      </div>
      <div style="border-top:1px solid var(--line);padding-top:15px;">
        <h4 style="color:#fff;margin-bottom:10px;">添加新账号</h4>
        <div class="form-group"><label>账号备注名</label><input type="text" id="setAccName" placeholder="例如: 我的主账号"></div>
        <div class="form-group"><label>RoxyAI API Key (sk-...)</label><input type="password" id="setApiKey" placeholder="sk-..."></div>
        <div class="form-group"><label>模型 ID</label><input type="text" id="setModel" value="gpt-6-astra"></div>
        <button class="btn-scan-side" style="margin:0; width:100%;" id="saveAccBtn">保存并切换至此账号</button>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗：记录档案 -->
<div class="modal-overlay" id="modalRecords">
  <div class="modal-content" style="max-width:800px;">
    <div class="modal-header"><span>深空观测档案库</span><span class="modal-close" onclick="closeModal('modalRecords')">×</span></div>
    <div class="modal-body" id="recordsList"></div>
  </div>
</div>

<!-- 弹窗：扫描报告 -->
<div class="modal-overlay" id="modalReport">
  <div class="modal-content">
    <div class="modal-header"><span id="reportTitle">目标扫描报告</span><span class="modal-close" onclick="closeModal('modalReport')">×</span></div>
    <div class="modal-body">
      <div id="reportMeta" style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:15px;"></div>
      <div class="report-text" id="reportText"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1. 初始化：时钟与 IP 定位
   ========================================================= */
// 时钟
setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent = 
    [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
}, 1000);

// 获取 IP 经纬度 (使用 vore.top 免费 API)
async function fetchIPLocation() {
  const el = document.getElementById('ipLocation');
  try {
    const res = await fetch('https://api.vore.top/api/IPdata');
    const data = await res.json();
    if (data.code === 200 && data.ipdata && data.ipdata.info) {
      const loc = data.ipdata;
      const info = loc.info;
      const lat = loc.latitude ? loc.latitude.toFixed(1) : '--';
      const lon = loc.longitude ? loc.longitude.toFixed(1) : '--';
      // 如果缺经纬度，使用地区代码顶替展示
      el.innerHTML = `<span>📍</span> ${info.prov || info.city || '未知'}, ${info.cc || 'CN'} · ${lat}°N, ${lon}°E`;
    } else {
      el.innerHTML = `<span>📍</span> 坐标解析失败`;
    }
  } catch (e) {
    el.innerHTML = `<span>📍</span> IP 定位服务离线`;
  }
}
fetchIPLocation();

/* =========================================================
   2. 状态与本地存储 (账号与记录)
   ========================================================= */
let accounts = JSON.parse(localStorage.getItem('roxy_accounts') || '[]');
let activeAccId = localStorage.getItem('roxy_active_acc') || null;
let records = JSON.parse(localStorage.getItem('star_records') || '[]');

if (accounts.length === 0) {
  accounts.push({ id: 'demo', name: '默认演示账号', key: '', model: 'gpt-6-astra' });
  localStorage.setItem('roxy_accounts', JSON.stringify(accounts));
  activeAccId = 'demo'; localStorage.setItem('roxy_active_acc', 'demo');
}

function getActiveAcc() { return accounts.find(a => a.id === activeAccId) || accounts[0]; }

function updateAccUI() {
  const acc = getActiveAcc();
  document.getElementById('currentAccName').textContent = acc ? acc.name : '未绑定';
  
  document.getElementById('accListContainer').innerHTML = accounts.map(a => `
    <div class="record-item" style="align-items:center; padding:10px;">
      <div style="flex:1;"><b style="color:#fff;">${a.name}</b><br><span style="font-size:11px;color:rgba(255,255,255,0.4)">Key: ${a.key ? 'sk-***' + a.key.slice(-4) : '未配置'}</span></div>
      ${a.id !== activeAccId ? `<button class="nav-item" style="padding:4px 10px;font-size:11px;" onclick="switchAcc('${a.id}')">切换</button>` : '<span style="color:var(--cyan);font-size:12px;">当前使用</span>'}
      ${a.id !== 'demo' ? `<button class="nav-item" style="border-color:#ff8080;color:#ff8080;padding:4px 10px;font-size:11px;margin-left:5px;" onclick="deleteAcc('${a.id}')">删除</button>` : ''}
    </div>
  `).join('');

  const dd = document.getElementById('accDropdown');
  dd.innerHTML = accounts.map(a => 
    `<div class="acc-item ${a.id === activeAccId ? 'active' : ''}" onclick="switchAcc('${a.id}')">${a.name}</div>`
  ).join('') + `<div class="acc-item" onclick="openModal('modalSettings')" style="color:var(--amber);">⚙️ 管理账号</div>`;
}

window.switchAcc = function(id) {
  activeAccId = id; localStorage.setItem('roxy_active_acc', id);
  updateAccUI(); document.getElementById('accDropdown').classList.remove('show');
}
window.deleteAcc = function(id) {
  if(!confirm('确定删除吗？')) return;
  accounts = accounts.filter(a => a.id !== id);
  if(activeAccId === id) activeAccId = accounts[0]?.id;
  localStorage.setItem('roxy_accounts', JSON.stringify(accounts));
  localStorage.setItem('roxy_active_acc', activeAccId);
  updateAccUI();
}
document.getElementById('accSwitch').addEventListener('click', (e) => {
  document.getElementById('accDropdown').classList.toggle('show'); e.stopPropagation();
});
document.addEventListener('click', () => document.getElementById('accDropdown').classList.remove('show'));

document.getElementById('saveAccBtn').addEventListener('click', () => {
  const name = document.getElementById('setAccName').value.trim();
  const key = document.getElementById('setApiKey').value.trim();
  if (!name || !key) return alert('请填写完整信息');
  const newAcc = { id: Date.now().toString(), name, key, model: document.getElementById('setModel').value.trim() };
  accounts.push(newAcc);
  activeAccId = newAcc.id;
  localStorage.setItem('roxy_accounts', JSON.stringify(accounts));
  localStorage.setItem('roxy_active_acc', activeAccId);
  updateAccUI(); closeModal('modalSettings');
  document.getElementById('setAccName').value = ''; document.getElementById('setApiKey').value = '';
  alert('账号已添加并切换');
});

/* =========================================================
   3. 弹窗控制
   ========================================================= */
window.openModal = function(id) {
  document.getElementById(id).classList.add('show');
  if (id === 'modalRecords') renderRecords();
}
window.closeModal = function(id) { document.getElementById(id).classList.remove('show'); }
window.viewImage = function(base64) {
  const w = window.open('');
  w.document.write(`<body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;"><img src="${base64}" style="max-width:100%;max-height:100%;"></body>`);
}

/* =========================================================
   4. 文本安全过滤
   ========================================================= */
function sanitizeText(text) {
  let clean = text.replace(/(https?:\/\/[^\s]+)|(www\.[^\s]+)/g, '[外部链接已屏蔽]');
  const badWords = ['政治', '军事', '涉政', '涉军', '国家', '政府', '虚假', '谣言'];
  badWords.forEach(w => clean = clean.replace(new RegExp(w, 'g'), '***'));
  return clean;
}

/* =========================================================
   5. Canvas 引擎与状态机
   ========================================================= */
const cv = document.getElementById('starfield');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let bgStars = [];
let nodes = [];
let mouse = { x: -1000, y: -1000 };
let hoveredNode = null;

const STATE_OVERVIEW = 0;
const STATE_WARPING = 1;
const STATE_SCANNING = 2;
const STATE_REPORT = 3;
let currentState = STATE_OVERVIEW;
let warpTarget = null;
let warpProgress = 0;
let scanTimer = 0;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  
  bgStars = Array.from({length: 400}, () => ({
    x: Math.random() * W, y: Math.random() * H,
    z: Math.random() * 0.8 + 0.2, r: Math.random() * 1.5 + 0.5
  }));
}
window.addEventListener('resize', resizeCanvas); resizeCanvas();

// 节点同步与位置处理
function syncNodes() {
  nodes = records.map((r, i) => {
    if (!r.cx || !r.cy) {
      r.cx = 0.2 + Math.random() * 0.6;
      r.cy = 0.2 + Math.random() * 0.6;
      r.id = r.id || Date.now() + i;
    }
    return {
      ...r,
      // 避免节点被左侧菜单(220px)和顶部(60px)挡住
      x: 250 + r.cx * (W - 300), 
      y: 80 + r.cy * (H - 120),
      radius: 4 + Math.random() * 3,
      pulse: Math.random() * Math.PI * 2
    };
  });
  localStorage.setItem('star_records', JSON.stringify(records));
}

// 交互事件
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (currentState !== STATE_OVERVIEW) {
    document.getElementById('tooltip').style.display = 'none'; return;
  }

  let found = null;
  for (let n of nodes) {
    const dx = mouse.x - n.x; const dy = mouse.y - n.y;
    if (Math.sqrt(dx*dx + dy*dy) < n.radius + 20) { found = n; break; }
  }
  
  hoveredNode = found;
  const tooltip = document.getElementById('tooltip');
  if (found) {
    document.body.style.cursor = 'pointer';
    tooltip.style.display = 'block';
    tooltip.innerHTML = `
      <div style="color:var(--cyan);font-weight:bold;margin-bottom:4px;">${found.targetName}</div>
      <div style="color:rgba(255,255,255,.7)">扫描时间: ${new Date(found.time).toLocaleString()}</div>
      <div style="color:rgba(255,255,255,.5);font-size:11px;margin-top:4px;">点击跃迁查看详情</div>
    `;
  } else {
    document.body.style.cursor = 'default';
    tooltip.style.display = 'none';
  }
});

window.addEventListener('click', (e) => {
  // 如果点击的是左侧菜单或顶部栏，不触发跃迁
  if (e.target.closest('.sidebar') || e.target.closest('.topbar')) return;
  if (currentState === STATE_OVERVIEW && hoveredNode) {
    startWarp(hoveredNode);
  }
});

function startWarp(node) {
  currentState = STATE_WARPING;
  warpTarget = node;
  warpProgress = 0;
  document.getElementById('tooltip').style.display = 'none';
}

// 渲染主循环
function draw(now) {
  const s = now * 0.001;
  ctx.clearRect(0, 0, W, H);

  // 背景星
  bgStars.forEach(st => {
    if (currentState === STATE_WARPING) {
      const cx = warpTarget.x, cy = warpTarget.y;
      st.x -= (st.x - cx) * 0.05 * warpProgress;
      st.y -= (st.y - cy) * 0.05 * warpProgress;
    } else {
      st.x += st.z * 0.1; if(st.x > W) st.x = 0;
    }
    ctx.fillStyle = `rgba(200,240,255,${st.z * 0.8})`;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
  });

  if (currentState === STATE_OVERVIEW) {
    nodes.forEach(n => {
      n.pulse += 0.02;
      const glow = (Math.sin(n.pulse) + 1) * 0.5;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.radius * (3 + glow*2), 0, Math.PI*2);
      ctx.fillStyle = `rgba(79,227,255,${0.1 + glow*0.1})`; ctx.fill();
      
      ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI*2);
      ctx.fillStyle = n === hoveredNode ? '#fff' : '#4fe3ff'; ctx.fill();
      
      if (n === hoveredNode) {
        ctx.strokeStyle = 'var(--amber)'; ctx.lineWidth = 1;
        ctx.strokeRect(n.x - 12, n.y - 12, 24, 24);
      }
    });
  } 
  else if (currentState === STATE_WARPING) {
    warpProgress += 0.03;
    const cx = warpTarget.x, cy = warpTarget.y;
    const scale = 1 + warpProgress * warpProgress * 20;
    
    ctx.beginPath(); ctx.arc(cx, cy, warpTarget.radius * scale, 0, Math.PI*2);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, warpTarget.radius * scale);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.5, 'rgba(79,227,255,0.8)');
    grad.addColorStop(1, 'rgba(79,227,255,0)');
    ctx.fillStyle = grad; ctx.fill();

    if (warpProgress >= 1) { currentState = STATE_SCANNING; scanTimer = 0; }
  }
  else if (currentState === STATE_SCANNING) {
    // 飞船扫描时，视觉中心向右侧偏移一点，避免被菜单挡住
    const cx = W/2 + 50, cy = H/2;
    const baseR = Math.min(W,H) * 0.15;
    scanTimer += 0.02;

    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.5);
    grad.addColorStop(0, '#fff'); grad.addColorStop(0.3, '#4fe3ff'); grad.addColorStop(1, 'rgba(79,227,255,0)');
    ctx.beginPath(); ctx.arc(cx, cy, baseR * 1.5, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();

    const scanR = (scanTimer % 3) / 3 * baseR * 3;
    ctx.beginPath(); ctx.arc(cx, cy, scanR, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(79,227,255,${1 - scanR/(baseR*3)})`; ctx.lineWidth = 2; ctx.stroke();

    const shipCount = 3;
    for (let i = 0; i < shipCount; i++) {
      const angle = (i / shipCount) * Math.PI * 2 + scanTimer * 0.5;
      const sx = cx + Math.cos(angle) * baseR * 1.8;
      const sy = cy + Math.sin(angle) * baseR * 1.8;
      
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(angle + Math.PI/2);
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(6, 10); ctx.lineTo(-6, 10); ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
      ctx.strokeStyle = 'var(--cyan)'; ctx.stroke();
      
      ctx.beginPath(); ctx.arc(0, 12, 4 + Math.random()*3, 0, Math.PI*2);
      ctx.fillStyle = '#4fe3ff'; ctx.fill();
      ctx.restore();
      
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(cx, cy);
      ctx.strokeStyle = 'rgba(79,227,255,0.2)'; ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
    }

    if (scanTimer > 3.5) { currentState = STATE_REPORT; showReport(warpTarget); }
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* =========================================================
   6. 扫描与 AI 请求逻辑
   ========================================================= */
const TARGET_POOL = [
  { name:'K2-18 b (水世界)', sub:'124 光年 · 潜在生命' },
  { name:'TRAPPIST-1e (地球2.0)', sub:'40.7 光年 · 岩石行星' },
  { name:'Proxima b (比邻星)', sub:'4.24 光年 · 最近恒星' },
  { name:'Kepler-442b (超级地球)', sub:'1206 光年 · 宜居带' },
  { name:'TOI-700 d (类地行星)', sub:'101.4 光年' },
  { name:'HD 40307 g (巨行星)', sub:'42.1 光年 · 宜居带' }
];

document.getElementById('btnRandomScan').addEventListener('click', async () => {
  const acc = getActiveAcc();
  if (!acc || !acc.key) return alert('请先在【系统设置】或右上角配置 API Key！');
  
  const btn = document.getElementById('btnRandomScan');
  btn.disabled = true; btn.textContent = '深空连接中...';
  
  const target = TARGET_POOL[Math.floor(Math.random() * TARGET_POOL.length)];
  const metrics = Array.from({length:5}, () => 60 + Math.floor(Math.random()*35));
  
  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        target: { name: target.name, sub: target.sub },
        metrics: metrics, apiKey: acc.key, model: acc.model
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '请求失败');
    
    const safeText = sanitizeText(data.analysis);
    const now = new Date();
    const newRecord = {
      id: Date.now(), targetName: target.name, targetSub: target.sub,
      analysis: safeText, time: now.toISOString(),
      cx: Math.random(), cy: Math.random()
    };
    
    btn.textContent = '生成快照...';
    const canvas = await html2canvas(document.body, { backgroundColor: '#040c1a', scale: 1 });
    newRecord.image = canvas.toDataURL('image/jpeg', 0.6);
    
    records.push(newRecord);
    if(records.length > 20) records.shift();
    localStorage.setItem('star_records', JSON.stringify(records));
    syncNodes();
    
  } catch (e) {
    alert('扫描失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '启动深空扫描';
  }
});

/* =========================================================
   7. 报告与档案列表
   ========================================================= */
function showReport(record) {
  document.getElementById('reportTitle').textContent = record.targetName + ' · 观测报告';
  document.getElementById('reportMeta').innerHTML = `
    目标特征：${record.targetSub} <br>
    扫描时间：${new Date(record.time).toLocaleString()} <br>
    <span style="color:var(--amber);">※ 内容已通过系统安全过滤审核</span>
  `;
  document.getElementById('reportText').textContent = record.analysis;
  openModal('modalReport');
  
  const originalClose = window.closeModal;
  window.closeModal = function(id) {
    if (id === 'modalReport') {
      currentState = STATE_OVERVIEW;
      window.closeModal = originalClose;
    }
    originalClose(id);
  };
}

function renderRecords() {
  const el = document.getElementById('recordsList');
  if (records.length === 0) {
    el.innerHTML = '<div style="color:rgba(255,255,255,.5);">暂无历史记录，请先扫描。</div>';
    return;
  }
  
  el.innerHTML = records.slice().reverse().map(r => `
    <div class="record-item">
      ${r.image ? `<img src="${r.image}" onclick="viewImage('${r.image}')" title="查看大图">` : '<div style="width:120px;height:80px;background:#111;border-radius:4px;display:grid;place-items:center;font-size:10px;">无快照</div>'}
      <div class="record-info">
        <div class="record-title">${r.targetName}</div>
        <div class="record-time">${new Date(r.time).toLocaleString()}</div>
        <div style="font-size:12px;color:#ccc;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${r.analysis}</div>
      </div>
    </div>
  `).join('');
}

// 初始启动
syncNodes();
updateAccUI();
</script>
